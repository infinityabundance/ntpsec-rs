# ntpsec-rs Oracle Differential Test Lab
#
# Runs ntpsec-rs and NTPsec side-by-side in isolated network namespaces,
# feeds them identical synthetic packet streams, and compares state.
#
# Usage:
#   cd ntpsec-rs
#   docker compose -f tests/docker/docker-compose.yml up --build
#   docker compose -f tests/docker/docker-compose.yml logs -f oracle
#
# CI: Runs as part of the oracle job in .github/workflows/ci.yml

services:
  # NTPsec reference daemon (the oracle)
  ntpsec-oracle:
    image: ubuntu:22.04
    command: >
      bash -c "
        apt-get update -qq &&
        apt-get install -y -qq ntpsec python3 &&
        sleep 2 &&
        ntpd -c /etc/ntp-oracle.conf -n -N
      "
    volumes:
      - ./ntp-oracle.conf:/etc/ntp-oracle.conf:ro
    networks:
      ntp-lab:
        ipv4_address: 10.100.0.10
    cap_add:
      - SYS_TIME
      - NET_ADMIN

  # ntpsec-rs daemon under test
  ntpsec-rs:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.ntpsec-rs
    command: >
      ntpd-rs -c /etc/ntp-rs.conf -n -N -I 10.100.0.20
    volumes:
      - ./ntp-rs.conf:/etc/ntp-rs.conf:ro
    networks:
      ntp-lab:
        ipv4_address: 10.100.0.20
    cap_add:
      - SYS_TIME
      - NET_ADMIN
    depends_on:
      - ntpsec-oracle

  # Synthetic packet generator for differential testing
  harness:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.harness
    networks:
      ntp-lab:
        ipv4_address: 10.100.0.30
    depends_on:
      - ntpsec-oracle
      - ntpsec-rs

networks:
  ntp-lab:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.0.0/24
