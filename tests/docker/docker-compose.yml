# ntpsec-rs Oracle Differential Test Lab
#
# Runs ntpsec-rs and NTPsec side-by-side in isolated network namespaces,
# feeds them identical synthetic packet streams, and compares state.
#
# Usage:
#   cd ntpsec-rs
#   docker compose -f tests/docker/docker-compose.yml up --build
#   docker compose -f tests/docker/docker-compose.yml logs -f oracle
#
# CI: Runs as part of the oracle job in .github/workflows/ci.yml

services:
  # NTPsec reference daemon (the oracle)
  ntpsec-oracle:
    image: ubuntu:22.04
    command: >
      bash -c "
        apt-get update -qq &&
        apt-get install -y -qq ntpsec python3 &&
        sleep 2 &&
        ntpd -c /etc/ntp-oracle.conf -n -N
      "
    ports:
      - "10123:123/udp"
    volumes:
      - ./ntp-oracle.conf:/etc/ntp-oracle.conf:ro
    networks:
      ntp-lab:
        ipv4_address: 10.100.0.10
    cap_add:
      - SYS_TIME
      - NET_ADMIN

  # ntpsec-rs daemon under test (package-based)
  ntpsec-rs:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.ntpsec-rs
    command: >
      ntpd-rs -c /etc/ntp-rs.conf -n -I 0.0.0.0
    volumes:
      - ./ntp-rs.conf:/etc/ntp-rs.conf:ro
    networks:
      ntp-lab:
        ipv4_address: 10.100.0.20
    cap_add:
      - SYS_TIME
      - NET_ADMIN
      - NET_BIND_SERVICE
    depends_on:
      - ntpsec-oracle
    environment:
      RUST_LOG: info

  # Synthetic packet generator for differential testing
  harness:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.harness
    networks:
      ntp-lab:
        ipv4_address: 10.100.0.30
    depends_on:
      - ntpsec-oracle
      - ntpsec-rs

  # Differential fuzzer: sends mutated packets to both daemons and compares
  differential-fuzz:
    build:
      context: ../..
      dockerfile: tests/docker/Dockerfile.harness
    networks:
      ntp-lab:
        ipv4_address: 10.100.0.31
    depends_on:
      - ntpsec-oracle
      - ntpsec-rs
    environment:
      ORACLE_HOST: "10.100.0.10"
      RS_HOST: "10.100.0.20"
    command: >
      python3 /tests/differential_fuzzer.py
        --oracle 10.100.0.10
        --candidate 10.100.0.20
        --iterations 100000
        --rate-limit 0.001

networks:
  ntp-lab:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.0.0/24
