# NTPsec oracle configuration for differential testing
# Uses a local refclock to stay synchronized, responds to lab clients

server 127.127.1.0 minpoll 4 maxpoll 6
fudge 127.127.1.0 stratum 5 refid LOCL

# Allow lab traffic only
restrict default ignore
restrict 127.0.0.1
restrict ::1
restrict 10.100.0.0 mask 255.255.255.0

# Lab settings
tos minsane 1 minclock 3 maxdist 1.5
tinker step 0.5 panic 100

driftfile /var/lib/ntp/ntp.drift
statsdir /var/log/ntpstats
statistics loopstats peerstats
