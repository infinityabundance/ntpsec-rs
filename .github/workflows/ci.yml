name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        toolchain: [stable, nightly]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build (excluding fuzz)
        run: cargo build --workspace --exclude ntpsec-rs-fuzz --verbose

      - name: Run tests (excluding fuzz)
        run: cargo test --workspace --exclude ntpsec-rs-fuzz --verbose

      - name: Clippy
        run: cargo clippy --workspace --exclude ntpsec-rs-fuzz -- -D warnings
        continue-on-error: true

      - name: Check formatting
        run: cargo fmt --check
        continue-on-error: true

  # Cross-compilation smoke test
  cross:
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl

    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --locked || true

      - name: Cross-compile core
        run: cargo build --target ${{ matrix.target }} -p ntpsec-rs-core

      - name: Cross-compile io
        run: cargo build --target ${{ matrix.target }} -p ntpsec-rs-io

      - name: Cross-compile tools
        run: |
          cargo build --target ${{ matrix.target }} -p ntpsec-rs-d || true
          cargo build --target ${{ matrix.target }} -p ntpsec-rs-query || true
          cargo build --target ${{ matrix.target }} -p ntpsec-rs-dig || true

  # Differential oracle test: compare ntpsec-rs against NTPsec
  oracle:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install NTPsec oracle (if available)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ntpsec ntpsec-ntpdig 2>/dev/null || echo "NTPsec not available in repo, skipping oracle install"

      - name: Build ntpsec-rs
        run: cargo build --release -p ntpsec-rs-d -p ntpsec-rs-query

      - name: Run oracle comparison tests
        run: cargo test --release --test oracle_compare -p ntpsec-rs-core -- --nocapture

  # Fuzz testing (daily or on schedule)
  fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked || true

      - name: Run fuzz targets
        run: |
          cd fuzz
          cargo fuzz run ntp_packet_decode -- -max_total_time=300 || true
          cargo fuzz run mode6_decode -- -max_total_time=300 || true
        continue-on-error: true
