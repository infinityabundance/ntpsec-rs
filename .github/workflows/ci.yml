name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        toolchain: [stable, nightly]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace 2>&1

      - name: Build all binaries
        run: |
          cargo build -p ntpsec-rs-d
          cargo build -p ntpsec-rs-query
          cargo build -p ntpsec-rs-dig
          cargo build -p ntpsec-rs-keygen

      - name: Run tests
        run: cargo test --workspace 2>&1

      - name: Clippy
        run: cargo clippy --workspace 2>&1

      - name: Check formatting
        run: cargo fmt --check 2>&1

  cross:
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl

    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross tools
        run: |
          if [[ "${{ matrix.target }}" == *-linux-gnu ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq gcc-aarch64-linux-gnu libc6-dev-arm64-cross 2>/dev/null || true
          fi
          if [[ "${{ matrix.target }}" == *-linux-musl ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq musl-tools 2>/dev/null || true
          fi

      - name: Set up linker
        run: |
          if [[ "${{ matrix.target }}" == aarch64-* ]]; then
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          fi

      - name: Cross-compile core
        run: cargo build --target ${{ matrix.target }} -p ntpsec-rs-core 2>&1

      - name: Cross-compile I/O (optional — platform-specific)
        continue-on-error: true
        run: cargo build --target ${{ matrix.target }} -p ntpsec-rs-io 2>&1

  oracle:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build ntpsec-rs
        run: cargo build --release -p ntpsec-rs-d -p ntpsec-rs-query 2>&1

      - name: Run oracle comparison tests
        run: cargo test --release --test oracle_compare -p ntpsec-rs-core -- --nocapture 2>&1

  fuzz:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked || true

      - name: Run fuzz targets (smoke test — 60s each)
        run: |
          cargo fuzz run ntp_packet_decode -- -max_total_time=60 2>&1 || echo "fuzz target ntp_packet_decode done"
          cargo fuzz run mode6_decode -- -max_total_time=60 2>&1 || echo "fuzz target mode6_decode done"
        continue-on-error: false
