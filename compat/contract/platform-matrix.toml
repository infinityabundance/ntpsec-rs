# ntpsec-rs Platform Support Matrix
# Generated: 2026-07-25

[meta]
notes = """
'Supported' means: builds, starts, exchanges packets, serves time,
exposes Mode 6, survives platform gauntlet tests.
Compilation-only is not sufficient for support claims.
"""

[[platform]]
arch = "x86-64"
os = "Linux (glibc)"
status = "implemented"
notes = "Primary development target. Sandbox/seccomp profiles exist."

[[platform]]
