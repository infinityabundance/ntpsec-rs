# ntpsec-rs Mode 6 Variable Registry
# Oracle: NTPsec 1.2.4+dfsg-1
# Generated from: ntp_control.rs, daemon_engine.rs, control_client.rs

[meta]
system_variables_total = 92
system_implemented = 52
system_placeholder = 40
peer_variables_total = 33
peer_implemented = 20
peer_placeholder = 13
opcodes_implemented = [
  "OP_READSTAT(1)", "OP_READVAR(2)", "OP_WRITEVAR(3)",
  "OP_READCLOCK(4)", "OP_WRITECLOCK(5)", "OP_SETTRAP(6)",
  "OP_ASYNCMSG(7)", "OP_CONFIGURE(8)", "OP_READ_MRU(10)",
  "OP_READ_ORDLIST_A(11)", "OP_REQ_NONCE(12)",
]
notes = """
OP_SETTRAP, OP_ASYNCMSG, OP_CONFIGURE are declared but produce BADOP
(no implementation). OP_READ_ORDLIST_A handled same as OP_READVAR.
"""

# ── Default READVAR responses ──────────────────────────────────────────

[default_response.system]
variables = [
  "version", "processor", "system", "leap", "stratum", "precision",
  "rootdelay", "rootdisp", "refid", "reftime", "peer", "tc", "offset",
  "frequency", "sys_jitter", "rootdist",
]
notes = "16 variables returned when 'rv' queried with associd=0."

[default_response.peer]
variables = [
  "srcaddr", "stratum", "offset", "delay", "dispersion", "jitter",
  "hpoll", "ppoll", "reach", "flash", "leap", "refid", "reftime",
  "hmode", "pmode", "precision",
]
notes = "16 variables returned when 'rv <associd>' queried."

